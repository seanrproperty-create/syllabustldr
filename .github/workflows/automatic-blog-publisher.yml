name: Automatic Blog Publisher

# Runs daily. Each run either starts the next queued article (only on
# Tuesday/Friday, or on a manual run) or continues translating a couple
# more languages for whichever article is already mid-rollout — never all
# 9 non-English languages in one run, because that's what triggered a real
# rate-limit from the free translation endpoint while building this
# pipeline. See scripts/publish-weekly.js for the full staging logic and
# content-queue/README.md for how the queue works.
#
# EVERY RUN PUSHES DIRECTLY TO main. No PR, no held-open branch. This is
# the second design tried here, not the first — the original design used
# peter-evans/create-pull-request to accumulate each day's commits onto
# one long-lived branch, held open until the whole rollout finished. That
# broke in two different ways once tested against real GitHub Actions runs
# (not just local mocked tests):
#   1. actions/checkout always checks out the default branch on schedule
#      AND workflow_dispatch triggers — there's no way around that. Since
#      the branch was deliberately left unmerged until the whole rollout
#      finished, `main` never reflected yesterday's progress, so every run
#      saw a "fresh" article and restarted it from English.
#   2. Even after patching (1) to explicitly check out the in-progress
#      branch, peter-evans/create-pull-request turned out not to accumulate
#      commits the way that design assumed — it rebuilds `branch` as
#      `base` + only the files that changed as an uncommitted diff during
#      that specific run, and force-pushes over whatever was there before.
#      It's built for "regenerate one commit reflecting current state"
#      (an auto-formatter bot, say), not "accrete independent contributions
#      across many separate runs." That silently deleted prior days'
#      already-published languages from the branch.
# Pushing straight to main on every run sidesteps both bugs entirely:
# there's no cross-run branch state to lose, because `main` IS the state,
# updated immediately every run. See templates/scheduled-content-pipeline.md
# in the one-page-site skill for the "direct-to-main" pattern this now
# follows, and why peter-evans/create-pull-request is a poor fit for a
# multi-run-accretive pipeline specifically (it's still fine for the
# common single-run-diff use case it's built for).
#
# THE REAL TRADEOFF OF THIS DESIGN: content goes live BEFORE it's checked,
# not instead of being checked. English (and each day's language batch)
# publishes to production the moment it's rendered — there is no held-back
# review window at all now, not even the earlier structural-gate-before-
# merge. scripts/lib/quality-gate.js still runs once a rollout finishes
# (all 10 languages), but it's now a POST-publish integrity check: if it
# fails, the content is already live, and a GitHub issue is filed so a
# human knows to go fix it — the gate no longer blocks anything from
# publishing. This was confirmed explicitly with the project owner as the
# accepted tradeoff for a zero-maintenance, many-sites-at-once workflow;
# don't quietly reintroduce a pre-publish review step without checking
# that's still wanted.

on:
  schedule:
    - cron: '0 9 * * *' # daily, 09:00 UTC — the script itself decides whether there's anything to do
  workflow_dispatch: {}

# Direct pushes to main need to be strictly serialized: two overlapping
# runs (e.g. a manual workflow_dispatch firing while the daily schedule is
# still running) would otherwise race to push and one would get a
# non-fast-forward rejection. This queues a second run instead of letting
# it run in parallel.
concurrency:
  group: automatic-blog-publisher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish-weekly
        id: publish
        env:
          # A manual run may as well be allowed to start a new article
          # regardless of day — the person triggering it clearly wants
          # something to happen.
          PUBLISH_FORCE_START: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run publish-weekly

      - name: Commit and push directly to main
        env:
          SLUG: ${{ steps.publish.outputs.slug }}
        run: |
          # git diff alone misses newly-created files (untracked) — a
          # continuation day only ever adds brand-new per-language files,
          # it doesn't touch any already-tracked file. git status
          # --porcelain is the only check here that catches untracked +
          # modified + staged paths — git diff --quiet silently dropped a
          # real day's translated output during testing (see
          # scheduled-content-pipeline.md's gotchas for the full story).
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning::No changes this run — either nothing was due to start/continue, or content-queue/pending is empty. Check blog/BACKLOG.md and content-queue/pending/ if that's unexpected."
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish daily language batch for ${SLUG:-queued article} [skip ci]"
          # HEAD:main (not plain `main`) pushes whatever commit HEAD
          # currently points at, regardless of whether checkout left the
          # workspace on a real local `main` branch or a detached HEAD at
          # main's tip — the latter is actions/checkout's default and
          # would make a plain `git push origin main` ambiguous/fragile.
          git push origin HEAD:main

      - name: File an issue if the finished rollout failed its post-publish check
        if: steps.publish.outputs.rollout-complete == 'true' && steps.publish.outputs.quality-gate-pass == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.publish.outputs.slug }}
          PROBLEMS: ${{ steps.publish.outputs.quality-gate-problems }}
        run: |
          BODY="The automated publish pipeline finished rolling out **$SLUG** into every language and pushed it live, but the post-publish structural check found problems. This content is ALREADY LIVE on the site — this issue is a fix-it flag, not a merge gate.

          **Problems found:**
          $PROBLEMS

          This only checks structure (broken links, missing brand names, untranslated fragments, truncated pages) — it doesn't mean the translation itself is necessarily bad, just that something needs a human look."
          gh issue create \
            --title "Quality check failed (already live): $SLUG" \
            --label "automated-content,needs-review" \
            --body "$BODY"
