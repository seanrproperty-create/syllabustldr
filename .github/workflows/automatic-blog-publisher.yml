name: Automatic Blog Publisher

# Runs daily. Each run either starts the next queued article (only on
# Tuesday/Friday, or on a manual run) or continues translating a couple
# more languages for whichever article is already mid-rollout — never all
# 9 non-English languages in one run, because that's what triggered a real
# rate-limit from the free translation endpoint while building this
# pipeline. See scripts/publish-weekly.js for the full staging logic and
# content-queue/README.md for how the queue works.
#
# Every run's changes land as commits on the SAME per-article branch
# (automated/blog-publish-<slug>), so one article's rollout accumulates
# into one pull request across its ~5-7 days.
#
# THIS PUBLISHES WITHOUT HUMAN REVIEW BY DESIGN. Once a rollout finishes
# (all 10 languages), scripts/lib/quality-gate.js runs a structural check
# (broken links, missing/mangled brand names, untranslated fragments,
# truncated pages). If it passes, this workflow merges the PR itself —
# nothing to click. That check is NOT real editorial or translation-
# accuracy review; it only catches "the pipeline broke," not "the
# translation reads badly." If it fails, the PR is left open (unmerged,
# so nothing bad goes live) and a GitHub issue is filed so a real person
# finds out without needing to babysit the Pull Requests tab. See
# templates/scheduled-content-pipeline.md's "Merging" section in the
# one-page-site skill for why this is the tradeoff, not a free lunch.
#
# IMPORTANT — why this checks out a branch other than the default one:
# actions/checkout defaults to the default branch (main) on every trigger
# type this workflow uses (schedule AND workflow_dispatch) — there is no
# way to make a schedule trigger check out anything else. The staged
# rollout (see publish-weekly.js) tracks progress by reading which files
# already exist on disk, and the PR for an in-progress rollout is
# deliberately left UNMERGED until every language is done. Put those two
# facts together and every run would check out main, find no trace of
# yesterday's progress (it only lives on the still-open PR branch), and
# restart the article from English — forever, never actually finishing.
# That's a real bug that shipped and was only caught by watching a live
# run. The "Find an in-progress rollout branch" step below is the fix: it
# resolves the correct ref to check out BEFORE checkout runs, so a
# continuing rollout resumes on its own branch (seeing the already-
# translated files) instead of starting over on main. It relies on
# content-queue/lib/queue.js's own invariant that at most one rollout is
# ever in progress at a time (getInProgressArticle() throws otherwise), so
# "the first branch matching the naming pattern" is always the right one.

on:
  schedule:
    - cron: '0 9 * * *' # daily, 09:00 UTC — the script itself decides whether there's anything to do
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Find an in-progress rollout branch, if one exists
        id: target-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name' \
            | grep '^automated/blog-publish-' | sort | head -n1 || true)
          if [ -n "$existing" ]; then
            echo "Resuming in-progress rollout branch: $existing"
            echo "ref=$existing" >> "$GITHUB_OUTPUT"
          else
            echo "No in-progress rollout branch found — starting fresh from the default branch."
            echo "ref=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target-branch.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish-weekly
        id: publish
        env:
          # A manual run may as well be allowed to start a new article
          # regardless of day — the person triggering it clearly wants
          # something to happen.
          PUBLISH_FORCE_START: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run publish-weekly

      - name: Check whether anything changed
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "::warning::No changes this run — either nothing was due to start/continue, or content-queue/pending is empty. Check blog/BACKLOG.md and content-queue/pending/ if that's unexpected."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        id: pr
        if: steps.changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chrono: automatically published semi-weekly educational article [skip ci]"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          # Always explicit, even though checkout may already be sitting on
          # this exact branch when resuming a rollout — without this, a
          # resumed run would infer `base` from the currently checked-out
          # branch (itself) and try to open a PR with identical head/base.
          base: ${{ github.event.repository.default_branch }}
          branch: automated/blog-publish-${{ steps.publish.outputs.slug }}
          title: >-
            ${{ steps.publish.outputs.rollout-complete == 'true'
              && format('Automated blog publish — {0}', steps.publish.outputs.slug)
              || format('🔄 Rolling out ({0}/9 languages) — {1}', steps.publish.outputs.langs-done, steps.publish.outputs.slug) }}
          body: |
            Opened/updated automatically by `.github/workflows/automatic-blog-publisher.yml`.

            ${{ steps.publish.outputs.rollout-complete == 'true' && 'All 10 languages are published. If the quality gate passes, this merges itself — no action needed. If it fails, see the linked issue.' || format('Still rolling out — {0}/9 non-English languages published so far. Each day adds a new commit here.', steps.publish.outputs.langs-done) }}

            Translation quality note: body copy is machine-translated via a
            free, unofficial Google Translate client (see
            `scripts/lib/translate.js` for why). The quality gate checks
            structure, not translation accuracy.
          labels: ${{ steps.publish.outputs.rollout-complete == 'true' && 'automated-content,quality-gate-pending' || 'automated-content,rolling-out' }}
          delete-branch: true

      - name: Auto-merge if the quality gate passed
        if: steps.publish.outputs.rollout-complete == 'true' && steps.publish.outputs.quality-gate-pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --merge --delete-branch

      - name: File an issue if the quality gate failed
        if: steps.publish.outputs.rollout-complete == 'true' && steps.publish.outputs.quality-gate-pass == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.publish.outputs.slug }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PROBLEMS: ${{ steps.publish.outputs.quality-gate-problems }}
        run: |
          BODY="The automated publish pipeline finished rolling out **$SLUG** into all 10 languages, but the pre-merge quality check failed, so it was NOT auto-merged. PR #$PR_NUMBER is still open for manual review.

          **Problems found:**
          $PROBLEMS

          This only checks structure (broken links, missing brand names, untranslated fragments, truncated pages) — it doesn't mean the translation itself is necessarily bad, just that something needs a human look before this goes live."
          gh issue create \
            --title "Quality gate failed: $SLUG" \
            --label "automated-content,needs-review" \
            --body "$BODY"
