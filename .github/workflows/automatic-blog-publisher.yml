name: Automatic Blog Publisher

# Runs daily. Each run either starts the next queued article (only on
# Tuesday/Friday, or on a manual run) or continues translating a couple
# more languages for whichever article is already mid-rollout — never all
# 9 non-English languages in one run, because that's what triggered a real
# rate-limit from the free translation endpoint while building this
# pipeline. See scripts/publish-weekly.js for the full staging logic and
# content-queue/README.md for how the queue works.
#
# Every run's changes land as commits on the SAME per-article branch
# (automated/blog-publish-<slug>), so one article's rollout accumulates
# into one pull request across its ~5-7 days instead of opening a new PR
# every day. Nothing goes live until that PR is reviewed and merged — this
# workflow never pushes directly to main.

on:
  schedule:
    - cron: '0 9 * * *' # daily, 09:00 UTC — the script itself decides whether there's anything to do
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run publish-weekly
        id: publish
        env:
          # A manual run may as well be allowed to start a new article
          # regardless of day — the person triggering it clearly wants
          # something to happen.
          PUBLISH_FORCE_START: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: npm run publish-weekly

      - name: Check whether anything changed
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "::warning::No changes this run — either nothing was due to start/continue, or content-queue/pending is empty. Check blog/BACKLOG.md and content-queue/pending/ if that's unexpected."
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request
        if: steps.changes.outputs.has-changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chrono: automatically published semi-weekly educational article [skip ci]"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: automated/blog-publish-${{ steps.publish.outputs.slug }}
          title: "Automated blog publish: ${{ steps.publish.outputs.slug }}"
          body: |
            Opened/updated automatically by `.github/workflows/automatic-blog-publisher.yml`.

            This article's non-English languages publish a couple at a time
            across several days (see `scripts/publish-weekly.js`) rather than
            all at once, to avoid rate-limiting the free translation
            endpoint. Each day's progress lands as a new commit on this same
            branch/PR. **Wait until the rollout looks complete (check which
            `{lang}/blog/${{ steps.publish.outputs.slug }}/` folders exist)
            before merging** — merging early ships a partially-translated
            article.

            Translation quality note: body copy is machine-translated via a
            free, unofficial Google Translate client (see
            `scripts/lib/translate.js` for why), not reviewed by a human or
            an LLM. Spot-check at least one non-English page before merging.
          labels: automated-content
          delete-branch: true
